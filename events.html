<style>
  :root{
    /* MEA CARES official palette, LinkME (staircase) expression — see DESIGN.md */
    --navy:#1C2945;
    --navy-deep:#10182B;
    --navy-light:#1E5BBD;
    --gold:#FFE445;
    --gold-bright:#FFE445;
    --gold-light:#FFF4B4;
    --select:#E3CA55; /* calmer than brand gold, for selected states */
    --cream:#F2EFE8;
    --paper:#FFFFFF;
    --ink:#1C2945;
    --ink-soft:#57647E;
    --line:#E4E0D3;
    --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
    --radius:16px;
    --shadow: 0 1px 2px rgba(28,41,69,.06), 0 8px 24px rgba(28,41,69,.06);
    --shadow-lg: 0 12px 32px rgba(28,41,69,.16), 0 2px 8px rgba(28,41,69,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#0E1524; --navy-deep:#080B14; --navy-light:#4C87DD; --gold:#FFE445; --gold-bright:#FFE445; --gold-light:#3A331C;
      --cream:#14181F; --paper:#1B2230; --ink:#ECEEF5; --ink-soft:#9FADBC;
      --line:#2A333C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lg: 0 16px 40px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Besley',Georgia,serif}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  a{color:inherit}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }

  /* ---------- Nav: real tabs, the current page is the gold one ---------- */
  .nav{
    position:sticky;top:0;z-index:40;
    background:rgba(14,24,38,.94);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    color:#fff;padding:12px 20px 0;
    transition:box-shadow .3s ease, background .3s ease;
    border-bottom:1px solid rgba(255,228,69,.28);
  }
  .nav.scrolled{background:rgba(10,20,31,.97);box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .nav-inner{max-width:1100px;margin:0 auto}
  .nav-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:700;font-size:1.08rem;letter-spacing:.2px;display:flex;align-items:center;gap:10px;font-family:'Besley',serif;color:#fff;text-decoration:none}
  .brand-logo{height:38px;width:auto;display:block}
  .nav-tabs{
    display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .nav-tabs::-webkit-scrollbar{display:none}
  .nav-tab{
    flex:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    padding:10px 15px;font-family:inherit;font-size:.88rem;font-weight:600;color:#cdd6e8;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-bottom:none;
    border-radius:10px 10px 0 0;text-decoration:none;cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .nav-tab svg{flex:none;opacity:.85}
  .nav-tab:hover{background:rgba(255,228,69,.14);color:#fff;border-color:rgba(255,228,69,.45)}
  .nav-tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  .nav-tab.current{background:var(--select);border-color:var(--select);color:#171308;cursor:default}

  .nav-saved-count{
    flex:none;font-size:.68rem;font-weight:700;color:var(--navy);background:var(--select);

    .nav-tab{

    .nav-tab svg{width:18px;height:18px}

  /* ---------- Header ---------- */
  .page-header{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);

  /* ---------- Timeline ---------- */
  /* Signature: a vertical spine, the brand's staircase turned on its side — each event is a step, "today" is where you're standing */
  .timeline-controls{
    max-width:760px;margin:0 auto;padding:28px 20px 0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:.88rem;color:var(--ink-soft);
  }
  .timeline-controls #viewLabel{font-weight:600;color:var(--ink)}
  .view-toggle{
    background:none;border:1px solid var(--line);color:var(--ink-soft);padding:8px 14px;border-radius:var(--r-md);
    font-size:.82rem;font-family:inherit;cursor:pointer;transition:border-color .18s ease,color .18s ease;
  }
  .view-toggle:hover{border-color:var(--gold);color:var(--ink)}
  .timeline-wrap{max-width:760px;margin:0 auto;padding:24px 20px 80px}
  .month-group{margin-bottom:38px}
  .month-heading{
    font-family:'Besley',serif;font-weight:600;font-size:1.3rem;margin:0 0 16px;
    padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--navy);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .month-heading{color:#fff} }
  .month-events{position:relative}
  .month-events::before{
    content:"";position:absolute;left:68px;top:6px;bottom:6px;width:2px;background:var(--line);
  }
  .event-row{
    position:relative;display:flex;gap:24px;padding:14px 0;border-bottom:1px solid var(--line);
  }
  .event-row:last-child{border-bottom:none}
  .event-row::before{
    content:"";position:absolute;left:64px;top:19px;width:9px;height:9px;border-radius:50%;
    background:var(--gold);border:2px solid var(--gold);box-shadow:0 0 0 3px var(--paper);
  }
  .event-row.is-past::before{background:var(--line);border-color:var(--line)}
  .event-row.is-past{opacity:.56}
  .event-date{
    flex:none;width:56px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;
    font-weight:600;color:var(--ink-soft);padding-top:2px;
  }
  .event-body{flex:1;min-width:0}
  .event-title{font-weight:600;font-size:.96rem;margin:0 0 4px}
  .event-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .event-tag{
    font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:var(--r-sm);
    text-transform:uppercase;letter-spacing:.06em;background:var(--gold-light);color:#716009;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .event-tag{color:var(--gold)} }
  .event-venue{font-size:.8rem;color:var(--ink-soft)}

  .today-marker{
    scroll-margin-top:150px;position:relative;z-index:1;
    display:flex;align-items:center;gap:12px;margin:18px 0;
  }
  .today-marker::before, .today-marker::after{content:"";flex:1;height:2px;background:var(--select)}
  .today-marker span{
    flex:none;font-family:'IBM Plex Mono',monospace;font-size:.7rem;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--navy);background:var(--select);
    padding:4px 10px;border-radius:var(--r-sm);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .today-marker span{color:#171308} }

  .empty, .loading, .error{
    max-width:760px;margin:60px auto;padding:0 20px;text-align:center;color:var(--ink-soft);
  }
  .error{color:#A3403A}
  .brand-pulse{
    width:40px;height:40px;margin:0 auto 14px;
    background:url('logo-mark.png') center/contain no-repeat;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}

  footer{
    max-width:1100px;margin:0 auto;padding:20px 20px 50px;
    font-size:.78rem;color:var(--ink-soft);text-align:center;line-height:1.6;
  }
  .footer-logo{height:36px;width:auto;display:block;margin:0 auto 14px;opacity:.8}
  .tip{
    position:fixed;display:none;z-index:100;max-width:240px;pointer-events:none;
    background:var(--navy-deep);color:#fff;border:1px solid rgba(255,228,69,.35);border-radius:var(--r-md);
    padding:8px 11px;font-size:.78rem;font-weight:500;line-height:1.4;text-align:left;
    box-shadow:var(--shadow-lg);
  }
</style>

<header class="page-header">
  <h1>Event Timeline</h1>
  <p>Curious about what's coming up across MEA CARES this year? Take a look below!</p>

<script>
(function(){
  "use strict";

  var SHEET_ID = "1wHf6J1uOP3a9qCdv-YSJqLkdrbXMDOmbJHmmvCiUGvg";
  var EVENTS_SHEET_NAME = "🗓️ Event Timeline";
  var EVENTS_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(EVENTS_SHEET_NAME);
  var POLL_INTERVAL_MS = 60000;

  var els = {};
  ["loadingState","errorState","emptyState","timelineWrap","nav","navSavedCount","timelineControls","viewLabel","viewToggle"]
    .forEach(function(id){ els[id] = document.getElementById(id); });
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // saved-listings count is index.html's data (same localStorage key, shared origin) — read-only here
  (function showSavedCount(){
    var count = 0;
    try {
      var raw = localStorage.getItem("linkme_saved_v1");
      count = raw ? JSON.parse(raw).length : 0;
    } catch (e) { /* private mode etc. — just show 0 */ }
    els.navSavedCount.textContent = count;
  })();

  // ---- minimal RFC4180 CSV parser (same as index.html) ----
  function parseCSV(text){
    var rows = [], row = [], field = "", i = 0, inQuotes = false, len = text.length;
    while (i < len) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i+1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += ch; i++; continue;
      } else {
        if (ch === '"') { inQuotes = true; i++; continue; }
        if (ch === ',') { row.push(field); field = ""; i++; continue; }
        if (ch === '\r') { i++; continue; }
        if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
        field += ch; i++; continue;
      }
    }
    row.push(field); rows.push(row);
    return rows;
  }

  // row[1] Month (set only on a block's first row, forward-filled) | row[2] Date | row[3] Initiative
  // row[4] Event title | row[5] Venue | row[6] Documentation — external columns only, internal (7+) ignored
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // best-effort only, for ordering/relative-position — the raw date string is always what's displayed
  function parseEventDate(monthStr, dateStr){
    var m = /([A-Za-z]+)\s+(\d{4})/.exec(monthStr || "");
    if (!m) return null;
    var monthIdx = MONTH_NAMES.indexOf(m[1]);
    var year = parseInt(m[2], 10);
    if (monthIdx === -1 || isNaN(year)) return null;
    var nums = (dateStr || "").match(/\d+/g);
    if (!nums) return new Date(year, monthIdx + 1, 0); // no date yet (TBA): upcoming until the month ends
    var day = parseInt(nums[nums.length - 1], 10); // a range counts as upcoming until its last day
    if (!(day >= 1 && day <= 31)) day = 1;
    return new Date(year, monthIdx, day);
  }

  function mapEvents(rows){
    var out = [], month = "";
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      if (!row) continue;
      if ((row[1] || "").trim()) month = row[1].trim();
      var initiative = (row[3] || "").trim();
      var title = (row[4] || "").trim();
      if (!initiative && !title) continue;
      var date = (row[2] || "").trim();
      // the sheet has "-16" for this one, which should read 2-16; this stops applying once the cell is fixed
      if (date === "-16" && title === "Externals Talent Pool Wave 1 Application Period") date = "2-16";
      out.push({
        month: month,
        date: date,
        initiative: initiative,
        title: title || "Untitled event",
        venue: (row[5] || "").trim(),
        _idx: r,
        _date: parseEventDate(month, date)
      });
    }
    return out;
  }

  function esc(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function eventHTML(ev, isPast){
    return (
      '<div class="event-row' + (isPast ? ' is-past' : '') + '">' +
      '<div class="event-date mono">' + esc(ev.date || "TBA") + '</div>' +
      '<div class="event-body">' +
      '<p class="event-title">' + esc(ev.title) + '</p>' +
      '<div class="event-meta">' +
      (ev.initiative ? '<span class="event-tag">' + esc(ev.initiative) + '</span>' : '') +
      (ev.venue ? '<span class="event-venue">' + esc(ev.venue) + '</span>' : '') +
      '</div></div></div>'
    );
  }

  // the first event whose parsed date is today-or-later — unparseable dates are treated as upcoming
  // (so a "TBA" entry never gets hidden among faded past events)
  function findTodayIndex(events){
    var today = new Date(); today.setHours(0,0,0,0);
    for (var i = 0; i < events.length; i++) {
      if (!events[i]._date || events[i]._date >= today) return i;
    }
    return -1; // everything's in the past
  }

  var allEvents = [];
  var showAll = false;

  // by default show only the upcoming month: the month holding the next event that hasn't happened yet
  // (or the last month on the timeline if everything has passed)
  function visibleEvents(events){
    if (showAll || !events.length) return events;
    var i = findTodayIndex(events);
    var month = events[i === -1 ? events.length - 1 : i].month;
    return events.filter(function(ev){ return ev.month === month; });
  }

  function render(all){
    allEvents = all;
    var events = visibleEvents(all);
    if (!events.length) {
      els.emptyState.style.display = "block";
      els.timelineWrap.style.display = "none";
      els.timelineControls.style.display = "none";
      return;
    }
    els.emptyState.style.display = "none";
    els.timelineWrap.style.display = "block";
    els.timelineControls.style.display = "flex";
    els.viewLabel.textContent = showAll ? "Showing the full timeline" : "Showing " + events[0].month;
    els.viewToggle.textContent = showAll ? "Show only the upcoming month" : "Show full timeline";

    var todayIdx = findTodayIndex(events);
    var html = "", lastMonth = null;
    events.forEach(function(ev, i){
      if (ev.month !== lastMonth) {
        if (lastMonth !== null) html += "</div></div>";
        html += '<div class="month-group"><h2 class="month-heading">' + esc(ev.month || "TBA") + '</h2><div class="month-events">';
        lastMonth = ev.month;
      }
      if (i === todayIdx) html += '<div class="today-marker" id="todayMarker"><span>Today</span></div>';
      html += eventHTML(ev, todayIdx !== -1 && i < todayIdx);
    });
    html += "</div></div>";
    if (todayIdx === -1 && events.length) html += '<div class="today-marker" id="todayMarker" style="margin-top:0"><span>Today</span></div>';
    els.timelineWrap.innerHTML = html;
  }


  var firstLoadDone = false;
  function loadData(){
    return fetch(EVENTS_URL)
      .then(function(res){
        if (!res.ok) throw new Error("Sheet fetch failed (" + res.status + ")");
        return res.text();
      })
      .then(function(text){
        var events = mapEvents(parseCSV(text));
        var isFirstLoad = !firstLoadDone;
        els.loadingState.style.display = "none";
        render(events);
        firstLoadDone = true;
        if (isFirstLoad) {
          var marker = document.getElementById("todayMarker");
          if (marker) marker.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        }
      })
      .catch(function(err){
        if (!firstLoadDone) {
          els.loadingState.style.display = "none";
          els.errorState.style.display = "block";
          els.errorState.textContent = "We couldn't load the event timeline. Check your connection and refresh the page. If it keeps happening, let the MEA CARES team know.";
        }
      });
  }

  (function revealCurrentTab(){
    var tabs = document.getElementById("navTabs"), cur = tabs && tabs.querySelector(".nav-tab.current");
    if (cur) tabs.scrollLeft = Math.max(0, cur.offsetLeft - 20);
  })();
  window.addEventListener("scroll", function(){
    els.nav.classList.toggle("scrolled", window.scrollY > 12);
  }, { passive: true });

  els.viewToggle.addEventListener("click", function(){
    showAll = !showAll;
    render(allEvents);
    var m = document.getElementById("todayMarker");
    if (!showAll) window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    else if (m) m.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  });

  loadData();
  setInterval(loadData, POLL_INTERVAL_MS);

})();
</script>
<script>
(function(){
  var tip = document.createElement("div");
  tip.className = "tip"; tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);
  function show(el){
    tip.textContent = el.getAttribute("data-tip");
    tip.style.display = "block";
    var r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    var left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
    var top = r.bottom + 8;
    if (top + t.height > window.innerHeight - 8) top = r.top - t.height - 8;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  function hide(){ tip.style.display = "none"; }
  document.addEventListener("mouseover", function(e){ var el = e.target.closest && e.target.closest("[data-tip]"); if (el) show(el); });
  document.addEventListener("mouseout", function(e){ if (e.target.closest && e.target.closest("[data-tip]")) hide(); });
  document.addEventListener("focusin", function(e){ var el = e.target.closest && e.target.closest("[data-tip]"); if (el) show(el); });
  document.addEventListener("focusout", hide);
  window.addEventListener("scroll", hide, { passive: true });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") hide(); });
})();
</script>
</body>
